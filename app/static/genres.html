<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracklytics — Genres</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <span class="brand">Tracklytics</span>
    <nav>
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="genres.html" class="nav-link">Genres</a>
      <a href="artists.html" class="nav-link">Artists</a>
      <a href="tracks.html" class="nav-link">Tracks</a>
      <a href="admin.html" class="nav-link">Admin</a>
    </nav>
  </header>

  <main class="page-content">
    <h1 class="page-title">Genre Analysis</h1>

    <section class="table-section">
      <div class="card">
        <div class="table-controls">
          <h2 class="section-title">All Genres</h2>
          <div class="sort-control">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" class="sort-select">
              <option value="avg_popularity" selected>Avg Popularity</option>
              <option value="avg_energy">Avg Energy</option>
              <option value="avg_danceability">Avg Danceability</option>
              <option value="avg_valence">Avg Valence</option>
              <option value="track_count">Track Count</option>
            </select>
          </div>
        </div>
        <div id="genre-table-container" class="table-container"></div>
      </div>
    </section>

    <section class="charts-section">
      <div class="card">
        <h2 class="section-title">Energy vs Danceability by Genre</h2>
        <div id="chart-scatter" class="chart-container"></div>
      </div>
      <div class="card">
        <h2 class="section-title">Top 20 Genres by Track Count</h2>
        <div id="chart-top-genres" class="chart-container"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>Tracklytics &copy; <span id="footer-year"></span></span>
  </footer>

  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/genres.js"></script>
</body>
</html>
