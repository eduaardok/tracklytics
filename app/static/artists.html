<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracklytics — Artists</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <span class="brand">Tracklytics</span>
    <nav>
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="genres.html" class="nav-link">Genres</a>
      <a href="artists.html" class="nav-link">Artists</a>
      <a href="tracks.html" class="nav-link">Tracks</a>
      <a href="admin.html" class="nav-link">Admin</a>
    </nav>
  </header>

  <main class="page-content">
    <h1 class="page-title">Artist Analysis</h1>

    <section class="table-section">
      <div class="card">
        <div class="table-controls">
          <h2 class="section-title">Artists</h2>
          <input
            type="text"
            id="artist-search"
            class="search-input"
            placeholder="Search artists..."
            aria-label="Search artists"
          >
        </div>
        <div id="artist-table-container" class="table-container"></div>
        <div class="pagination">
          <button id="prev-btn" class="pagination-btn" disabled>Previous</button>
          <span id="page-info" class="page-info"></span>
          <button id="next-btn" class="pagination-btn">Next</button>
        </div>
      </div>
    </section>

    <section class="charts-section">
      <div class="card">
        <h2 class="section-title">Top 15 Artists by Track Count</h2>
        <div id="chart-artists" class="chart-container"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>Tracklytics &copy; <span id="footer-year"></span></span>
  </footer>

  <!-- Detail Panel Modal -->
  <div id="detail-panel" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/artists.js"></script>
</body>
</html>
