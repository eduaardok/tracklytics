<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="profile-root"></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth, getSession, logout } from '/js/auth.js';
  import { renderSidebar, renderPlayer } from '/js/components.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('profile.html');
  renderPlayer();

  const user = getSession();
  const initial = (user?.name?.[0] ?? user?.email?.[0] ?? '?').toUpperCase();

  document.getElementById('profile-root').innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${initial}</div>
      <div>
        <div class="profile-name">${user?.name || 'Usuario'}</div>
        <div class="profile-email">${user?.email || ''}</div>
        <div class="profile-role">${user?.role || 'user'}</div>
      </div>
    </div>

    <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:2rem">
      ${(user?.role === 'admin' || user?.role === 'analyst') ? `
        <a href="/analytics/dashboard.html" class="btn btn-outline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Ver analítica</a>` : ''}
      <button class="btn btn-outline" onclick="document.getElementById('edit-section').style.display='block'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Editar perfil
      </button>
      <button class="btn" style="border:1px solid var(--danger);color:var(--danger)" id="logout-btn">
        Cerrar sesión
      </button>
    </div>

    <div id="edit-section" style="display:none; max-width:400px">
      <h2 class="section-title">Editar perfil</h2>
      <div id="edit-alert"></div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="edit-name" value="${user?.name || ''}" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;color:var(--text);width:100%"/>
      </div>
      <button class="btn btn-primary" style="max-width:200px" id="save-btn">Guardar cambios</button>
    </div>`;

  document.getElementById('logout-btn').addEventListener('click', logout);

  document.getElementById('save-btn')?.addEventListener('click', () => {
    const name = document.getElementById('edit-name').value.trim();
    if (!name) return;
    const updated = { ...user, name };
    localStorage.setItem('pb_user', JSON.stringify(updated));
    document.getElementById('edit-alert').innerHTML = '<div class="alert alert-success">Guardado localmente.</div>';
  });
</script>
</body>
</html>
