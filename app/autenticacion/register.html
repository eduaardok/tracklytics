<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrarse — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo-t">T</span><span class="logo-rest">racklytics</span></div>
    <h1>Crear cuenta</h1>
    <div id="alert-box"></div>
    <form id="register-form">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="name" placeholder="Tu nombre" required/>
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password"/>
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="role">
          <option value="user">Usuario</option>
          <option value="analyst">Analista</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Crear cuenta</button>
    </form>
    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="/autenticacion/login.html">Inicia sesión</a>
    </div>
  </div>
</div>

<script type="module">
  import { register, isLoggedIn } from '/js/auth.js';

  if (isLoggedIn()) window.location.href = '/catalogo/home.html';

  const form = document.getElementById('register-form');
  const alertBox = document.getElementById('alert-box');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Creando cuenta…';
    try {
      await register(
        document.getElementById('email').value,
        document.getElementById('password').value,
        document.getElementById('name').value,
        document.getElementById('role').value,
      );
      window.location.href = '/catalogo/home.html';
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  });
</script>
</body>
</html>
