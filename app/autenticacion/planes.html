<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi plan — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <h1 class="section-title">Mi plan</h1>

    <div id="current-plan" class="mb-3"></div>

    <h2 class="section-title mb-2">Planes disponibles</h2>
    <div id="plans-grid" class="grid-cards"></div>

    <div id="confirm-form" style="display:none; max-width:420px; margin-top:1.5rem">
      <h2 class="section-title" id="confirm-title"></h2>
      <div id="confirm-error" style="font-size:.85rem; color:#fc8181; margin-bottom:.6rem; min-height:1.2em"></div>
      <div class="form-group" id="payment-field">
        <label>Método de pago</label>
        <input type="text" id="metodo-pago" placeholder="Ej. tarjeta terminada en 4242"
               style="background:var(--surface2); border:1px solid var(--border); color:var(--text);
                      padding:.6rem .9rem; border-radius:var(--radius); font-size:.9rem; font-family:inherit; width:100%"/>
      </div>
      <div style="display:flex; gap:.5rem; margin-top:.75rem">
        <button class="btn btn-primary btn-sm" id="btn-confirm">Confirmar suscripción</button>
        <button class="btn btn-outline btn-sm" id="btn-cancel-form">Cancelar</button>
      </div>
    </div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer } from '/js/components.js';
  import { Suscripciones } from '/js/api.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('autenticacion/planes.html');
  renderPlayer();

  let selectedPlan = null;
  let planesDisponibles = [];

  function renderCurrentPlan(activa) {
    const el = document.getElementById('current-plan');
    if (!activa) {
      el.innerHTML = `<p class="text-muted">No tienes una suscripción activa.</p>`;
      return;
    }
    const created = activa.created ? new Date(activa.created.replace(' ', 'T')) : null;
    const fechaTxt = created && !isNaN(created) ? created.toLocaleDateString() : '—';
    el.innerHTML = `
      <div class="card" style="max-width:420px">
        <div class="card-title">Plan activo: ${activa.tipo_plan}</div>
        <div class="card-sub">${activa.monto > 0 ? `${activa.monto} ${activa.moneda}` : 'Gratis'} · desde ${fechaTxt}</div>
        <button class="btn btn-outline btn-sm" style="margin-top:.75rem; border-color:var(--danger); color:#fc8181" id="btn-cancel-active">
          Cancelar suscripción
        </button>
      </div>`;
    document.getElementById('btn-cancel-active')?.addEventListener('click', async () => {
      if (!confirm('¿Cancelar tu suscripción activa?')) return;
      try {
        await Suscripciones.cancelar(activa.id);
        await loadAll();
      } catch (err) {
        alert(err.message);
      }
    });
  }

  function renderPlans(planes, activa) {
    planesDisponibles = planes;
    document.getElementById('plans-grid').innerHTML = planes.map(p => {
      const esActual = activa?.tipo_plan === p.id;
      return `
      <div class="card plan-card ${esActual ? 'plan-card-current' : ''}">
        <div class="card-title">${p.nombre}${esActual ? ' <span class="plan-current-badge">Plan actual</span>' : ''}</div>
        <div class="plan-card-desc">${p.descripcion}</div>
        <div class="card-sub" style="font-weight:700; margin:.4rem 0">${p.precio > 0 ? `${p.precio} ${p.moneda}/mes` : 'Gratis'}</div>
        ${esActual
          ? `<button class="btn btn-outline btn-sm" disabled>Ya tienes este plan</button>`
          : `<button class="btn btn-primary btn-sm" onclick="window.__selectPlan('${p.id}')">Suscribirme</button>`}
      </div>`;
    }).join('');
  }

  window.__selectPlan = function(planId) {
    selectedPlan = planesDisponibles.find(p => p.id === planId);
    if (!selectedPlan) return;
    document.getElementById('confirm-title').textContent = `Confirmar suscripción a ${selectedPlan.nombre}`;
    document.getElementById('payment-field').style.display = selectedPlan.precio > 0 ? 'block' : 'none';
    document.getElementById('metodo-pago').value = '';
    document.getElementById('confirm-error').textContent = '';
    document.getElementById('confirm-form').style.display = 'block';
    document.getElementById('confirm-form').scrollIntoView({ behavior: 'smooth' });
  };

  document.getElementById('btn-cancel-form').addEventListener('click', () => {
    document.getElementById('confirm-form').style.display = 'none';
    selectedPlan = null;
  });

  document.getElementById('btn-confirm').addEventListener('click', async () => {
    const errEl = document.getElementById('confirm-error');
    errEl.textContent = '';
    if (!selectedPlan) return;

    const metodoPago = document.getElementById('metodo-pago').value.trim();
    if (selectedPlan.precio > 0 && !metodoPago) {
      errEl.textContent = 'Se requiere un método de pago válido para activar este plan.';
      return;
    }

    try {
      await Suscripciones.confirmar(selectedPlan.id, metodoPago || null);
      document.getElementById('confirm-form').style.display = 'none';
      selectedPlan = null;
      await loadAll();
    } catch (err) {
      errEl.textContent = err.message;
    }
  });

  async function loadAll() {
    const [planesRes, activaRes] = await Promise.all([
      Suscripciones.planes(),
      Suscripciones.activa(),
    ]);
    const activa = activaRes.data ?? null;
    renderPlans(planesRes.data ?? planesRes, activa);
    renderCurrentPlan(activa);
  }

  loadAll().catch(err => {
    document.getElementById('current-plan').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  });
</script>
</body>
</html>
