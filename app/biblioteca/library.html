<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Biblioteca — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <h1 class="section-title">Mi Biblioteca</h1>

    <div class="stat-cards" id="lib-stats"></div>

    <div class="library-tabs">
      <button class="tab-btn active" data-tab="favorites">Favoritos</button>
      <button class="tab-btn" data-tab="history">Historial</button>
      <button class="tab-btn" data-tab="playlists">Playlists</button>
    </div>

    <div id="tab-favorites">
      <div id="favorites-list"></div>
    </div>

    <div id="tab-history" style="display:none">
      <div id="history-list"></div>
    </div>

    <div id="tab-playlists" style="display:none">
      <!-- Vista lista de playlists -->
      <div id="playlists-view">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem">
          <span style="font-size:.95rem; color:var(--text-muted)" id="pl-count-label"></span>
          <button class="btn btn-primary btn-sm" id="btn-create-pl">＋ Nueva playlist</button>
        </div>

        <!-- Formulario inline crear playlist -->
        <div id="create-pl-form" style="display:none; margin-bottom:1.25rem">
          <div style="display:flex; gap:.5rem">
            <input id="new-pl-name" type="text" placeholder="Nombre de la playlist…" maxlength="60"
                   style="flex:1; background:var(--surface2); border:1px solid var(--border); color:var(--text);
                          padding:.6rem .9rem; border-radius:var(--radius); font-size:.9rem; font-family:inherit"
                   onkeydown="if(event.key==='Enter') handleCreate(); if(event.key==='Escape') toggleCreateForm(false)"/>
            <button class="btn btn-primary btn-sm" onclick="handleCreate()">Crear</button>
            <button class="btn btn-outline btn-sm" onclick="toggleCreateForm(false)">Cancelar</button>
          </div>
          <div id="create-pl-error" style="font-size:.8rem; color:#fc8181; margin-top:.4rem; min-height:1.2em"></div>
        </div>

        <div id="playlist-grid" class="playlist-grid"></div>
        <p id="pl-empty" style="display:none; color:var(--text-muted); font-size:.9rem">
          Aún no tienes playlists. ¡Crea una y organiza tu música!
        </p>
      </div>

      <!-- Vista detalle de playlist -->
      <div id="playlist-detail" style="display:none">
        <div class="playlist-detail-header">
          <button class="playlist-detail-back" onclick="window.showPlaylistList()">← Volver</button>
          <div>
            <div style="font-size:1.2rem; font-weight:800" id="detail-name"></div>
            <div style="font-size:.82rem; color:var(--text-muted)" id="detail-count"></div>
          </div>
          <button class="btn btn-outline btn-sm" style="margin-left:auto"
                  id="btn-rename-pl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>Renombrar</button>
          <button class="btn btn-outline btn-sm" style="border-color:var(--danger); color:#fc8181"
                  id="btn-delete-pl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Eliminar playlist</button>
        </div>
        <div id="detail-track-list"></div>
        <p id="detail-empty" style="display:none; color:var(--text-muted); font-size:.9rem">
          Esta playlist está vacía. Agrega canciones desde el catálogo.
        </p>
      </div>
    </div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth, getSession } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow, setQueue, coverArt, emptyState, skeletonRows, genreColor, GLYPH } from '/js/components.js';
  import { initPlaylists, getPlaylists, createPlaylist, removeTrackFromPlaylist, deletePlaylist, renamePlaylist } from '/js/playlists.js';
  import { initFavorites, getFavorites } from '/js/favorites.js';
  import { initHistory, getHistory } from '/js/history.js';
  import { showToast } from '/js/toast.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('biblioteca/library.html');
  renderPlayer();

  // RN-CAT-004: la biblioteca personal (favoritos/historial) es exclusiva de
  // Usuario B2C. Se verifica el rol aquí, de forma proactiva, en vez de
  // esperar al 403 del backend en cada llamada — así el Cliente B2B ve un
  // único mensaje claro al entrar, no un error por cada pestaña.
  const _isB2B = getSession()?.role === 'analyst';
  if (_isB2B) {
    showToast('La biblioteca personal es exclusiva de Usuario B2C. Tu cuenta es de Cliente B2B.', 'warning', 6000);
    document.querySelector('main.main-content').innerHTML = `
      <h1 class="section-title">Mi Biblioteca</h1>
      <div class="alert alert-error" style="max-width:560px">
        Esta sección (favoritos, historial y playlists personales) es exclusiva de Usuario B2C.
        Tu cuenta tiene rol de Cliente B2B — usa el panel de <a href="/analytics/dashboard.html" style="color:#fc8181;text-decoration:underline">Analítica</a> en su lugar.
      </div>`;
    throw new Error('blocked: B2B no tiene acceso a biblioteca personal');
  }

  // ── Tabs ─────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-favorites').style.display = btn.dataset.tab === 'favorites' ? '' : 'none';
      document.getElementById('tab-history').style.display   = btn.dataset.tab === 'history'   ? '' : 'none';
      document.getElementById('tab-playlists').style.display = btn.dataset.tab === 'playlists' ? '' : 'none';
    });
  });

  function timeAgo(isoStr) {
    // ClickHouse DateTime se devuelve sin zona horaria; forzar UTC para parseo correcto
    const utc  = isoStr && !/Z|[+-]\d{2}:\d{2}$/.test(isoStr) ? isoStr.replace(' ', 'T') + 'Z' : isoStr;
    const mins = Math.floor((Date.now() - new Date(utc).getTime()) / 60000);
    if (mins < 1)  return 'ahora mismo';
    if (mins < 60) return `hace ${mins} minuto${mins !== 1 ? 's' : ''}`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `hace ${hours} hora${hours !== 1 ? 's' : ''}`;
    const days = Math.floor(hours / 24);
    return `hace ${days} día${days !== 1 ? 's' : ''}`;
  }

  // ── Favoritos ────────────────────────────────────────────
  let _favTracks = [];
  window.__setQueueFavs = () => setQueue(_favTracks, 0);

  async function renderFavorites() {
    const favs = getFavorites();
    _favTracks  = favs;
    const el    = document.getElementById('favorites-list');
    if (!favs.length) {
      el.innerHTML = emptyState(
        GLYPH.heart,
        'Sin favoritos aún',
        'Marca una canción como favorita para guardarla aquí.',
        '<a href="/catalogo/catalog.html" class="btn btn-primary btn-sm">Explorar catálogo</a>'
      );
      return;
    }
    el.innerHTML = `
      <div style="margin-bottom:.75rem">
        <button class="btn btn-primary btn-sm" onclick="window.__setQueueFavs()">▶ Reproducir todo</button>
      </div>
      <div class="track-list">${favs.map((t, i) => trackRow(t, i)).join('')}</div>`;
  }

  // ── Historial ────────────────────────────────────────────
  async function renderHistory() {
    const history = getHistory();
    const el      = document.getElementById('history-list');
    if (!history.length) {
      el.innerHTML = emptyState(
        GLYPH.clock,
        'Historial vacío',
        'Las canciones que escuches aparecerán aquí.'
      );
      return;
    }
    el.innerHTML = `<div class="track-list">${history.map((entry, i) => `
      <div class="history-entry">
        ${trackRow(entry, i)}
        <div class="history-time">${timeAgo(entry.event_timestamp)}</div>
      </div>`).join('')}</div>`;
  }

  // ── Mosaic cover helper ───────────────────────────────────
  function mosaicCover(pl) {
    const tracks = pl.tracks || [];
    if (!tracks.length) return coverArt(0, 'md');
    const ids = [...new Set(tracks.map(t => t.genre_id || 0))].slice(0, 4);
    if (ids.length === 1) {
      return `<div class="playlist-card-mosaic single">
        <div class="mosaic-cell" style="background:${genreColor(ids[0] % 10)}"></div>
      </div>`;
    }
    if (ids.length === 2) {
      return `<div class="playlist-card-mosaic two">
        ${ids.map(id => `<div class="mosaic-cell" style="background:${genreColor(id % 10)}"></div>`).join('')}
      </div>`;
    }
    return `<div class="playlist-card-mosaic">
      ${ids.slice(0, 4).map(id => `<div class="mosaic-cell" style="background:${genreColor(id % 10)}"></div>`).join('')}
    </div>`;
  }

  // ── Playlists ─────────────────────────────────────────────
  let currentPlaylistId = null;

  function renderPlaylistGrid() {
    const playlists = getPlaylists();
    const grid      = document.getElementById('playlist-grid');
    const empty     = document.getElementById('pl-empty');
    const countLbl  = document.getElementById('pl-count-label');

    countLbl.textContent = playlists.length
      ? `${playlists.length} playlist${playlists.length !== 1 ? 's' : ''}`
      : '';

    if (!playlists.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = playlists.map(pl => `
      <div class="playlist-card" onclick="window.openPlaylist('${pl.id}')">
        ${mosaicCover(pl)}
        <div class="playlist-card-name">${pl.name}</div>
        <div class="playlist-card-count">${pl.tracks.length} canción${pl.tracks.length !== 1 ? 'es' : ''}</div>
        <button class="playlist-card-del" title="Eliminar playlist"
                onclick="event.stopPropagation(); window.handleDeletePlaylist('${pl.id}', '${pl.name.replace(/'/g,"\\'")}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>`).join('');
  }

  window.openPlaylist = function(id) {
    const pl = getPlaylists().find(p => p.id === id);
    if (!pl) return;
    currentPlaylistId = id;

    document.getElementById('detail-name').textContent  = pl.name;
    document.getElementById('detail-count').textContent =
      `${pl.tracks.length} canción${pl.tracks.length !== 1 ? 'es' : ''}`;

    const listEl  = document.getElementById('detail-track-list');
    const emptyEl = document.getElementById('detail-empty');
    if (pl.tracks.length) {
      emptyEl.style.display = 'none';
      listEl.innerHTML = `<div class="track-list">${
        pl.tracks.map((t, i) => playlistTrackRow(t, i, id)).join('')
      }</div>`;
    } else {
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
    }

    document.getElementById('playlists-view').style.display  = 'none';
    document.getElementById('playlist-detail').style.display = 'block';
  };

  function playlistTrackRow(track, index, playlistId) {
    const name = track.track_name || track.name || '—';
    return `
      <div class="track-row" data-id="${track.track_id}"
           onclick="location.href='/catalogo/track.html?id=${track.track_id}'">
        <div class="track-num">${index + 1}</div>
        <div class="track-info">
          <div class="track-name">${name}</div>
          <div class="track-artist">${track.artist_name || ''}</div>
        </div>
        <div class="track-duration">${track.duration_ms ? msToTime(track.duration_ms) : '—'}</div>
        <button class="playlist-remove-btn" title="Quitar de la playlist"
                onclick="event.stopPropagation(); window.handleRemoveTrack('${playlistId}', '${track.track_id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>`;
  }

  function msToTime(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  window.showPlaylistList = function() {
    currentPlaylistId = null;
    document.getElementById('playlists-view').style.display  = 'block';
    document.getElementById('playlist-detail').style.display = 'none';
    renderPlaylistGrid();
  };

  window.handleRemoveTrack = function(playlistId, trackId) {
    removeTrackFromPlaylist(playlistId, trackId);
    window.openPlaylist(playlistId);
  };

  window.handleDeletePlaylist = function(id, name) {
    if (!confirm(`¿Eliminar la playlist "${name}"? Esta acción no se puede deshacer.`)) return;
    deletePlaylist(id);
    renderPlaylistGrid();
  };

  // Botón eliminar en vista detalle
  document.getElementById('btn-delete-pl').addEventListener('click', () => {
    const pl = getPlaylists().find(p => p.id === currentPlaylistId);
    if (!pl) return;
    if (!confirm(`¿Eliminar la playlist "${pl.name}"? Esta acción no se puede deshacer.`)) return;
    deletePlaylist(currentPlaylistId);
    window.showPlaylistList();
  });

  // Botón renombrar en vista detalle
  document.getElementById('btn-rename-pl').addEventListener('click', () => {
    const pl = getPlaylists().find(p => p.id === currentPlaylistId);
    if (!pl) return;
    const newName = prompt('Nuevo nombre de la playlist:', pl.name);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed) return;
    if (getPlaylists().some(p => p.id !== pl.id && p.name.toLowerCase() === trimmed.toLowerCase())) {
      alert('Ya existe una playlist con ese nombre.');
      return;
    }
    renamePlaylist(pl.id, trimmed);
    document.getElementById('detail-name').textContent = trimmed;
  });

  // ── Crear playlist ─────────────────────────────────────────
  window.toggleCreateForm = function(show) {
    document.getElementById('create-pl-form').style.display = show ? 'block' : 'none';
    document.getElementById('create-pl-error').textContent = '';
    if (show) {
      document.getElementById('new-pl-name').value = '';
      document.getElementById('new-pl-name').focus();
    }
  };

  window.handleCreate = function() {
    const name  = document.getElementById('new-pl-name').value.trim();
    const errEl = document.getElementById('create-pl-error');
    if (!name) { errEl.textContent = 'El nombre no puede estar vacío.'; return; }
    if (getPlaylists().some(p => p.name.toLowerCase() === name.toLowerCase())) {
      errEl.textContent = 'Ya existe una playlist con ese nombre.'; return;
    }
    createPlaylist(name);
    window.toggleCreateForm(false);
    renderPlaylistGrid();
  };

  document.getElementById('btn-create-pl').addEventListener('click', () => {
    window.toggleCreateForm(true);
  });

  // ── Init ──────────────────────────────────────────────────
  (async () => {
    await Promise.all([initFavorites(), initHistory(), initPlaylists()]);

    const favCount  = getFavorites().length;
    const histCount = getHistory(200).length;
    const plCount   = getPlaylists().length;

    document.getElementById('lib-stats').innerHTML = `
      <div class="stat-card">
        <div class="stat-card-icon">${GLYPH.heart}</div>
        <div class="stat-card-number">${favCount}</div>
        <div class="stat-card-label">Favoritos</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon">${GLYPH.clock}</div>
        <div class="stat-card-number">${histCount}</div>
        <div class="stat-card-label">Escuchadas</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon">${GLYPH.music}</div>
        <div class="stat-card-number">${plCount}</div>
        <div class="stat-card-label">Playlists</div>
      </div>`;

    await renderFavorites();
    await renderHistory();
    renderPlaylistGrid();
  })();
</script>
</body>
</html>
