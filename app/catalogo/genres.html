<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Géneros — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="page-content">
      <h1 class="section-title">Géneros</h1>
      <div id="genres-area"><div class="loading-center"><div class="spinner"></div></div></div>
      <div id="genre-detail" style="display:none">
        <div class="page-header" style="margin-top:2rem">
          <div class="page-thumb" id="genre-thumb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
          <div class="page-meta">
            <div class="page-type">Género</div>
            <div class="page-name" id="genre-name"></div>
            <div class="page-sub" id="genre-sub"></div>
          </div>
        </div>
        <div class="attr-grid mb-4" id="genre-stats"></div>
        <h2 class="section-title" id="genre-tracks-title"></h2>
        <div id="genre-tracks-list"></div>
      </div>
    </div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow, coverArt, skeletonRows, setQueue, genreColor } from '/js/components.js';
  import { Genres, Tracks } from '/js/api.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('catalogo/genres.html');
  renderPlayer();

  const activeId = new URLSearchParams(location.search).get('id');

  async function load() {
    const area = document.getElementById('genres-area');
    try {
      const res    = await Genres.list();
      const genres = res.data ?? res;

      area.innerHTML = `<div class="genre-grid">${genres.map((g, i) => `
        <div class="genre-card" style="background:${genreColor(i)}" data-id="${g.genre_id}">
          <div>
            <div style="font-size:1rem;font-weight:700">${g.name}</div>
            ${g.mood ? `<div style="font-size:.8rem;opacity:.8;font-weight:500;margin-top:.25rem">${g.mood}</div>` : ''}
          </div>
        </div>`).join('')}</div>`;

      area.querySelectorAll('.genre-card').forEach(card => {
        card.addEventListener('click', () => {
          location.href = `/catalogo/genres.html?id=${card.dataset.id}`;
        });
      });

      if (activeId) {
        const found = genres.find(g => String(g.genre_id) === activeId);
        if (found) {
          const activeCard = area.querySelector(`.genre-card[data-id="${activeId}"]`);
          if (activeCard) activeCard.style.outline = '3px solid #fff';
          loadGenreDetail(activeId, found.name);
        }
      }
    } catch (err) {
      area.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  async function loadGenreDetail(genreId, fallbackName) {
    const detailEl    = document.getElementById('genre-detail');
    const nameEl      = document.getElementById('genre-name');
    const subEl       = document.getElementById('genre-sub');
    const statsEl     = document.getElementById('genre-stats');
    const tracksTitle = document.getElementById('genre-tracks-title');
    const listEl      = document.getElementById('genre-tracks-list');

    window.__genreTracks = [];
    window.__setQueue    = setQueue;
    detailEl.style.display = 'block';
    nameEl.textContent = fallbackName;
    listEl.innerHTML = skeletonRows(2);
    detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    try {
      const [genreRes, tracksRes] = await Promise.all([
        Genres.get(genreId),
        Tracks.byGenre(genreId, 30),
      ]);
      const genre  = genreRes.data ?? genreRes;
      const tracks = tracksRes.data ?? tracksRes;

      window.__genreTracks = tracks;
      document.getElementById('genre-thumb').innerHTML =
        coverArt(parseInt(genreId) % 10 || 0, 'lg', '🎵');

      nameEl.textContent = genre.name;
      subEl.textContent  = [genre.parent_genre, genre.origin_decade ? genre.origin_decade + 's' : null]
        .filter(Boolean).join(' · ');

      statsEl.innerHTML = `
        ${genre.mood ? `
        <div class="attr-card">
          <div class="attr-label">Mood</div>
          <div class="attr-value" style="font-size:.9rem">${genre.mood}</div>
        </div>` : ''}
        <div class="attr-card">
          <div class="attr-label">Canciones</div>
          <div class="attr-value">${genre.track_count ?? '—'}</div>
        </div>
        <div class="attr-card">
          <div class="attr-label">Popularidad</div>
          <div class="attr-value">${genre.avg_popularity ?? '—'}</div>
        </div>
        ${genre.origin_decade ? `
        <div class="attr-card">
          <div class="attr-label">Década</div>
          <div class="attr-value">${genre.origin_decade}s</div>
        </div>` : ''}`;

      tracksTitle.textContent = `Canciones de ${genre.name}`;
      if (tracks.length) {
        listEl.innerHTML = `
          <div style="margin-bottom:.75rem">
            <button class="btn btn-primary btn-sm"
              onclick="window.__setQueue(window.__genreTracks, 0)">▶ Reproducir todo</button>
          </div>
          <div class="track-list">${tracks.map((t, i) => trackRow(t, i)).join('')}</div>`;
      } else {
        listEl.innerHTML = '<p style="color:var(--text-muted)">Sin canciones disponibles.</p>';
      }
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
