<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Álbum — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="page-content"><div class="loading-center"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow } from '/js/components.js';
  import { Albums, Tracks } from '/js/api.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('');
  renderPlayer();

  const albumId = new URLSearchParams(location.search).get('id');
  if (!albumId) { location.href = '/catalogo/catalog.html'; }

  async function load() {
    const el = document.getElementById('page-content');
    try {
      const [albumRes, tracksRes] = await Promise.all([
        Albums.get(albumId),
        Tracks.byAlbum(albumId, 50),
      ]);
      const album  = albumRes.data  ?? albumRes;
      const tracks = tracksRes.data ?? tracksRes;

      el.innerHTML = `
        <div class="page-header">
          <div class="page-thumb">💿</div>
          <div class="page-meta">
            <div class="page-type">Álbum</div>
            <div class="page-name">${album.name}</div>
            <div class="page-sub">${album.release_year || ''} · ${tracks.length} canciones</div>
          </div>
        </div>

        <div class="attr-grid mb-4">
          <div class="attr-card">
            <div class="attr-label">Año</div>
            <div class="attr-value">${album.release_year || '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Tipo</div>
            <div class="attr-value" style="font-size:.9rem">${album.album_type || '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Canciones</div>
            <div class="attr-value">${album.track_count ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Popularidad</div>
            <div class="attr-value">${album.avg_popularity ?? '—'}</div>
          </div>
          ${album.language ? `
          <div class="attr-card">
            <div class="attr-label">Idioma</div>
            <div class="attr-value" style="font-size:.9rem">${album.language}</div>
          </div>` : ''}
        </div>

        <h2 class="section-title">Canciones</h2>
        <div class="track-list">${tracks.map((t, i) => trackRow(t, i)).join('')}</div>`;
    } catch (err) {
      el.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
