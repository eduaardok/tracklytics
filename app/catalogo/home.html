<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div class="home-header">
      <h1 id="greeting">Bienvenido</h1>
      <p>¿Qué quieres escuchar hoy?</p>
    </div>

    <section id="continue-section" style="display:none" class="mb-4">
      <h2 class="section-title">Continuar escuchando</h2>
      <div id="continue-list"></div>
    </section>

    <section id="para-ti-section" style="display:none" class="mb-4">
      <h2 class="section-title">Para ti</h2>
      <div id="para-ti-list"></div>
    </section>

    <section class="mb-4">
      <h2 class="section-title">Top canciones</h2>
      <div id="top-tracks"></div>
    </section>

    <section class="mb-4">
      <h2 class="section-title">Artistas destacados</h2>
      <div class="grid-cards" id="top-artists"></div>
    </section>

    <section>
      <h2 class="section-title">Géneros populares</h2>
      <div class="grid-cards" id="top-genres"></div>
    </section>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth, getSession } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow, coverArt, skeletonRows, setQueue, genreColor } from '/js/components.js';
  import { Tracks, Artists, Genres } from '/js/api.js';
  import { initFavorites, getFavorites } from '/js/favorites.js';
  import { initHistory, getHistory } from '/js/history.js';

  if (!requireAuth()) throw new Error('not auth');

  renderSidebar('catalogo/home.html');
  renderPlayer();

  const user = getSession();
  document.getElementById('greeting').textContent =
    user?.name?.split(' ')[0] || user?.email?.split('@')[0] || 'Hola';

  // ── Personalización ───────────────────────────────────────
  function renderContinue() {
    const history = getHistory(6);
    if (!history.length) return;
    window.__histTracks = history;
    window.__playHistEntry = (i) => setQueue([window.__histTracks[i]], 0);
    document.getElementById('continue-section').style.display = '';
    document.getElementById('continue-list').innerHTML = `
      <div class="continue-grid">
        ${history.map((entry, i) => `
          <div class="continue-card" onclick="window.__playHistEntry(${i})">
            ${coverArt(i, 'sm', '🎵')}
            <div class="continue-card-meta">
              <div class="continue-card-name">${entry.track_name || '—'}</div>
              <div class="continue-card-artist">${entry.artist_name || ''}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  function renderParaTi() {
    const favs = getFavorites();
    if (!favs.length) return;
    const seen   = new Set();
    const genres = [];
    for (const f of favs) {
      if (f.genre_name && !seen.has(f.genre_name)) {
        seen.add(f.genre_name);
        genres.push(f.genre_name);
        if (genres.length === 4) break;
      }
    }
    if (!genres.length) return;
    document.getElementById('para-ti-section').style.display = '';
    document.getElementById('para-ti-list').innerHTML = `
      <div class="grid-cards">
        ${genres.map((g, i) => `
          <div class="card" style="cursor:default">
            ${coverArt(i, 'md', '🎵')}
            <div class="card-title">${g}</div>
          </div>`).join('')}
      </div>`;
  }

  // ── Canciones ─────────────────────────────────────────────
  async function loadTracks() {
    document.getElementById('top-tracks').innerHTML = skeletonRows(5);
    try {
      const res    = await Tracks.top(20);
      const tracks = res.data ?? res;
      window.__homeTracks = tracks;
      document.getElementById('top-tracks').innerHTML =
        `<div class="track-list">${tracks.map((t, i) => trackRow(t, i)).join('')}</div>`;
      document.querySelectorAll('#top-tracks .track-row').forEach((row, i) => {
        row.onclick = null;
        row.addEventListener('click', e => {
          if (e.target.closest('button')) return;
          setQueue(window.__homeTracks, i);
        });
      });
    } catch (err) {
      document.getElementById('top-tracks').innerHTML =
        `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  // ── Artistas ──────────────────────────────────────────────
  async function loadArtists() {
    try {
      const res     = await Artists.top(8);
      const artists = res.data ?? res;
      document.getElementById('top-artists').innerHTML = artists.map((a, i) => `
        <div class="card" onclick="location.href='/catalogo/artist.html?id=${a.artist_id}'">
          ${coverArt(i, 'md', '🎤')}
          <div class="card-title">${a.name}</div>
          <div class="card-sub">${a.track_count ?? ''} canciones</div>
        </div>`).join('');
    } catch {
      document.getElementById('top-artists').innerHTML = '';
    }
  }

  // ── Géneros ───────────────────────────────────────────────
  async function loadGenres() {
    try {
      const res    = await Genres.list();
      const genres = (res.data ?? res).slice(0, 8);
      document.getElementById('top-genres').innerHTML = genres.map((g, i) => `
        <div class="card" onclick="location.href='/catalogo/genres.html?id=${g.genre_id}'">
          ${coverArt(i, 'md', '🎵')}
          <div class="card-title">${g.name}</div>
          <div class="card-sub">${g.track_count ?? ''} canciones</div>
        </div>`).join('');
    } catch {
      document.getElementById('top-genres').innerHTML = '';
    }
  }

  // ── Init ──────────────────────────────────────────────────
  await Promise.all([initFavorites(), initHistory()]);
  renderContinue();
  renderParaTi();
  loadTracks();
  loadArtists();
  loadGenres();
</script>
</body>
</html>
