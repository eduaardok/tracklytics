<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscar — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <h1 class="section-title">Buscar</h1>
    <p class="text-muted mb-3" style="margin-top:-.5rem">
      Encuentra canciones, artistas y álbumes en un solo lugar.
      Para explorar todo el catálogo por género, ve a <a href="/catalogo/catalog.html" style="text-decoration:underline">Catálogo</a>.
    </p>

    <div class="search-bar">
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input type="text" id="search-input" placeholder="Canciones, artistas, álbumes…" autofocus/>
    </div>

    <div class="tag-list" id="filter-tags">
      <span class="tag active" data-filter="all">Todo</span>
      <span class="tag" data-filter="tracks">Canciones</span>
      <span class="tag" data-filter="artists">Artistas</span>
      <span class="tag" data-filter="albums">Álbumes</span>
    </div>

    <select id="genre-filter" style="margin:.5rem 0 1rem; background:var(--surface2); border:1px solid var(--border);
            color:var(--text); padding:.5rem .8rem; border-radius:var(--radius); font-size:.85rem; font-family:inherit">
      <option value="">Todos los géneros</option>
    </select>

    <div id="results"></div>
    <div id="pagination" class="d-flex align-items-center gap-2 mt-3" style="display:none"></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow, spinner } from '/js/components.js';
  import { Tracks, Artists, Albums, Genres } from '/js/api.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('catalogo/search.html');
  renderPlayer();

  const PAGE_SIZE = 20;
  let activeFilter = 'all';
  let activeGenre = '';
  let currentPage = 1;
  let debounceTimer;

  Genres.list().then(res => {
    const genres = res.data ?? res;
    const sel = document.getElementById('genre-filter');
    sel.insertAdjacentHTML('beforeend', genres.map(g => `<option value="${g.name}">${g.name}</option>`).join(''));
  }).catch(() => {});

  document.getElementById('genre-filter').addEventListener('change', (e) => {
    activeGenre = e.target.value;
    currentPage = 1;
    doSearch();
  });

  document.querySelectorAll('.tag').forEach(tag => {
    tag.addEventListener('click', () => {
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      activeFilter = tag.dataset.filter;
      currentPage = 1;
      doSearch();
    });
  });

  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(debounceTimer);
    currentPage = 1;
    debounceTimer = setTimeout(doSearch, 350);
  });

  function renderPagination(total) {
    const pagEl = document.getElementById('pagination');
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (activeFilter !== 'tracks' || totalPages <= 1) {
      pagEl.style.display = 'none';
      pagEl.innerHTML = '';
      return;
    }
    pagEl.style.display = 'flex';
    pagEl.innerHTML = `
      <button class="btn btn-outline btn-sm" id="pag-prev" ${currentPage <= 1 ? 'disabled' : ''}>← Anterior</button>
      <span class="text-muted" style="font-size:.85rem">Página ${currentPage} de ${totalPages}</span>
      <button class="btn btn-outline btn-sm" id="pag-next" ${currentPage >= totalPages ? 'disabled' : ''}>Siguiente →</button>`;
    document.getElementById('pag-prev')?.addEventListener('click', () => { currentPage--; doSearch(); });
    document.getElementById('pag-next')?.addEventListener('click', () => { currentPage++; doSearch(); });
  }

  async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    const resultsEl = document.getElementById('results');
    const pagEl = document.getElementById('pagination');
    if (!q) { resultsEl.innerHTML = ''; pagEl.style.display = 'none'; return; }

    resultsEl.innerHTML = spinner();
    try {
      const offset = (currentPage - 1) * PAGE_SIZE;
      const promises = [];
      let tracksTotal = 0;
      if (activeFilter === 'all' || activeFilter === 'tracks') {
        const tracksLimit = activeFilter === 'tracks' ? PAGE_SIZE : 10;
        const tracksOffset = activeFilter === 'tracks' ? offset : 0;
        promises.push(Tracks.search(q, tracksLimit, tracksOffset, activeGenre).then(r => {
          tracksTotal = r.total ?? (r.data ?? r).length;
          return { type: 'tracks', data: r.data ?? r };
        }));
      }
      if (activeFilter === 'all' || activeFilter === 'artists') promises.push(Artists.search(q, 6).then(r => ({ type: 'artists', data: r.data ?? r })));
      if (activeFilter === 'all' || activeFilter === 'albums')  promises.push(Albums.search(q, 6).then(r => ({ type: 'albums',  data: r.data ?? r })));

      const results = await Promise.all(promises);
      let html = '';

      for (const { type, data } of results) {
        if (!data.length) continue;
        if (type === 'tracks') {
          html += `<h2 class="section-title mb-2">Canciones</h2><div class="track-list">${data.map((t, i) => trackRow(t, i)).join('')}</div><div class="mb-3"></div>`;
        } else if (type === 'artists') {
          html += `<h2 class="section-title mb-2">Artistas</h2><div class="grid-cards">${data.map(a => `
            <div class="card" onclick="location.href='/catalogo/artist.html?id=${a.artist_id}'">
              <div class="card-thumb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></div>
              <div class="card-title">${a.name}</div>
            </div>`).join('')}</div><div class="mb-3"></div>`;
        } else if (type === 'albums') {
          html += `<h2 class="section-title mb-2">Álbumes</h2><div class="grid-cards">${data.map(a => `
            <div class="card" onclick="location.href='/catalogo/album.html?id=${a.album_id}'">
              <div class="card-thumb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg></div>
              <div class="card-title">${a.name}</div>
              <div class="card-sub">${a.artist_name || ''}</div>
            </div>`).join('')}</div><div class="mb-3"></div>`;
        }
      }

      resultsEl.innerHTML = html || '<p class="text-muted">Sin resultados para "' + q + '"</p>';
      renderPagination(tracksTotal);
    } catch (err) {
      resultsEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      pagEl.style.display = 'none';
    }
  }
</script>
</body>
</html>
