<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canción — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="page-content"><div class="loading-center"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, playTrack } from '/js/components.js';
  import { Tracks } from '/js/api.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('');
  renderPlayer();

  const trackId = new URLSearchParams(location.search).get('id');
  if (!trackId) { location.href = '/catalogo/home.html'; }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function featureBar(label, value) {
    if (value == null) return '';
    const pct = Math.round(value * 100);
    return `
      <div class="feature-bar">
        <div class="feature-label">${label}</div>
        <div class="feature-track"><div class="feature-fill" style="width:${pct}%"></div></div>
        <div class="feature-value">${pct}%</div>
      </div>`;
  }

  async function load() {
    const el = document.getElementById('page-content');
    try {
      const res   = await Tracks.get(trackId);
      const track = res.data ?? res;

      // Cache para el modal de playlists
      window.__trackCache = window.__trackCache || {};
      window.__trackCache[track.track_id] = track;

      el.innerHTML = `
        <div class="page-header">
          <div class="page-thumb">🎵</div>
          <div class="page-meta">
            <div class="page-type">Canción</div>
            <div class="page-name">${track.track_name || '—'}</div>
            <div class="page-sub">
              <a href="/catalogo/artist.html?id=${track.artist_id}" class="text-primary">${track.artist_name || ''}</a>
              ${track.album_name ? ` · <a href="/catalogo/album.html?id=${track.album_id}" class="text-muted">${track.album_name}</a>` : ''}
              ${track.genre_name ? ` · ${track.genre_name}` : ''}
              · ${track.duration_ms ? fmt(track.duration_ms) : '—'}
            </div>
            <div style="margin-top:.75rem; display:flex; gap:.75rem; flex-wrap:wrap">
              <button class="btn btn-primary" style="max-width:140px"
                onclick="window.__playTrack(${JSON.stringify(track).replace(/"/g,'&quot;')})">
                ▶ Reproducir
              </button>
              <button class="btn btn-outline" style="max-width:180px"
                onclick="window.__plModal.open('${track.track_id}')">
                ＋ Agregar a playlist
              </button>
            </div>
          </div>
        </div>

        <h2 class="section-title">Popularidad</h2>
        <div class="pop-bar-wrap">
          <div class="pop-bar-header">
            <span class="pop-bar-label">Score</span>
            <span class="pop-bar-score">${track.popularity ?? '—'}</span>
          </div>
          <div class="pop-bar-track">
            <div class="pop-bar-fill" style="width:${track.popularity ?? 0}%"></div>
          </div>
        </div>

        <h2 class="section-title">Características de audio</h2>
        <div class="feature-bars">
          ${featureBar('Danceability',     track.danceability)}
          ${featureBar('Energy',           track.energy)}
          ${featureBar('Valence',          track.valence)}
          ${featureBar('Acousticness',     track.acousticness)}
          ${featureBar('Speechiness',      track.speechiness)}
          ${featureBar('Instrumentalness', track.instrumentalness)}
          ${featureBar('Liveness',         track.liveness)}
        </div>

        <div class="attr-grid">
          <div class="attr-card">
            <div class="attr-label">Tempo</div>
            <div class="attr-value">${track.tempo ? Math.round(track.tempo) + ' BPM' : '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Duración</div>
            <div class="attr-value">${track.duration_ms ? fmt(track.duration_ms) : '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Loudness</div>
            <div class="attr-value">${track.loudness != null ? track.loudness.toFixed(1) + ' dB' : '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Género</div>
            <div class="attr-value" style="font-size:.85rem">${track.genre_name || '—'}</div>
          </div>
        </div>`;
    } catch (err) {
      el.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
