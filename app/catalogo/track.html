<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canción — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="page-content"><div class="loading-center"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, playTrack, coverArt, skeletonRows, genreColor } from '/js/components.js';
  import { Tracks, getPlanTier } from '/js/api.js';
  import { initFavorites, isFavorite, toggleFavorite } from '/js/favorites.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('');
  renderPlayer();

  const params  = new URLSearchParams(location.search);
  const factId  = params.get('fact_id');
  const trackId = params.get('id');
  if (!factId && !trackId) { location.href = '/catalogo/home.html'; }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function featureBar(label, value, desc) {
    if (value == null) return '';
    const pct = Math.round(value * 100);
    return `
      <div class="feature-bar">
        <div class="feature-label">
          ${label}
          ${desc ? `<span style="display:block;font-size:.72rem;font-weight:400;color:var(--text-muted);margin-top:.1rem">${desc}</span>` : ''}
        </div>
        <div class="feature-track"><div class="feature-fill" style="width:${pct}%"></div></div>
        <div class="feature-value">${pct}%</div>
      </div>`;
  }

  async function load() {
    const el = document.getElementById('page-content');
    el.innerHTML = skeletonRows(3);
    try {
      const [res, plan] = await Promise.all([
        factId ? Tracks.getByFact(factId) : Tracks.get(trackId),
        getPlanTier().catch(() => 'free'),
      ]);
      const track = res.data ?? res;

      window.__trackCache = window.__trackCache || {};
      window.__trackCache[track.track_id] = track;

      window.__trackFavToggle = function() {
        const added = toggleFavorite(track);
        document.getElementById('fav-btn').textContent =
          added ? '♥ Quitar de favoritos' : '♥ Añadir a favoritos';
      };

      const ci = (parseInt(track.genre_id) || 0) % 10;
      const c1 = genreColor(ci);
      const c2 = genreColor((ci + 3) % 10);

      el.innerHTML = `
        <div class="detail-hero" style="background:linear-gradient(135deg,${c1},${c2})">
          ${coverArt(ci, 'xl')}
          <div class="detail-hero-meta">
            <div class="detail-hero-type">Canción</div>
            <div class="detail-hero-name">${track.track_name || '—'}</div>
            <div class="detail-hero-sub">
              <a href="/catalogo/artist.html?id=${track.artist_id}" class="text-primary">${track.artist_name || ''}</a>
              ${track.album_name ? ` · <a href="/catalogo/album.html?id=${track.album_id}" class="text-muted">${track.album_name}</a>` : ''}
              ${track.genre_name ? ` · ${track.genre_name}` : ''}
              · ${track.duration_ms ? fmt(track.duration_ms) : '—'}
            </div>
            <div class="detail-hero-actions">
              <button class="btn btn-primary"
                onclick="window.__playTrack(${JSON.stringify(track).replace(/"/g,'&quot;')})">
                ▶ Reproducir
              </button>
              <button class="btn btn-outline" id="fav-btn"
                onclick="window.__trackFavToggle()">
                ${isFavorite(track.track_id) ? '♥ Quitar de favoritos' : '♥ Añadir a favoritos'}
              </button>
              <button class="btn btn-outline"
                onclick="window.__plModal.open('${track.track_id}')">
                ＋ Agregar a playlist
              </button>
            </div>
          </div>
        </div>

        <h2 class="section-title">Popularidad</h2>
        <div class="pop-bar-wrap">
          <div class="pop-bar-header">
            <span class="pop-bar-label">Score</span>
            <span class="pop-bar-score">${track.popularity ?? '—'}</span>
          </div>
          <div class="pop-bar-track">
            <div class="pop-bar-fill" style="width:${track.popularity ?? 0}%"></div>
          </div>
        </div>

        <h2 class="section-title">Características de audio</h2>
        ${plan === 'free'
          ? `<div class="card" style="max-width:480px; text-align:center; padding:1.5rem 1.25rem; opacity:.85">
               <div style="font-size:1.6rem; margin-bottom:.5rem">🔒</div>
               <div style="font-weight:600; margin-bottom:.35rem">Sección exclusiva Premium</div>
               <div style="font-size:.875rem; color:var(--text-muted); margin-bottom:1rem">
                 Las características de audio detalladas (danceability, energy, valence…) están disponibles en el plan Premium.
               </div>
               <a href="/autenticacion/planes.html" class="btn btn-primary btn-sm">Actualizar a Premium</a>
             </div>`
          : `<div class="feature-bars">
               ${featureBar('Danceability',     track.danceability,     'Qué tan bailable es la canción')}
               ${featureBar('Energy',           track.energy,           'Intensidad y actividad percibida')}
               ${featureBar('Valence',          track.valence,          'Positividad emocional del sonido')}
               ${featureBar('Acousticness',     track.acousticness,     'Probabilidad de ser acústica')}
               ${featureBar('Speechiness',      track.speechiness,      'Presencia de palabras habladas')}
               ${featureBar('Instrumentalness', track.instrumentalness, 'Ausencia de voz (más = instrumental)')}
               ${featureBar('Liveness',         track.liveness,         'Probabilidad de ser en vivo')}
             </div>`
        }

        <div class="attr-grid">
          <div class="attr-card">
            <div class="attr-label">Tempo</div>
            <div class="attr-value">${track.tempo ? Math.round(track.tempo) + ' BPM' : '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Duración</div>
            <div class="attr-value">${track.duration_ms ? fmt(track.duration_ms) : '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Loudness</div>
            <div class="attr-value">${track.loudness != null ? track.loudness.toFixed(1) + ' dB' : '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Género</div>
            <div class="attr-value" style="font-size:.85rem">${track.genre_name || '—'}</div>
          </div>
        </div>`;
    } catch (err) {
      el.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  await initFavorites();
  load();
</script>
</body>
</html>
