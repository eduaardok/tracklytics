<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artista — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="page-content"><div class="loading-center"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow, coverArt, skeletonRows, setQueue, genreColor, GLYPH } from '/js/components.js';
  import { Artists, Tracks } from '/js/api.js';
  import { initFavorites } from '/js/favorites.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('');
  renderPlayer();

  const artistId = new URLSearchParams(location.search).get('id');
  if (!artistId) { location.href = '/catalogo/catalog.html'; }

  function _colorIdx(id) {
    const n = parseInt(id, 10);
    return (isNaN(n) ? id.charCodeAt(0) : n) % 10;
  }

  async function load() {
    const el = document.getElementById('page-content');
    el.innerHTML = skeletonRows(3);
    try {
      const [artistRes, tracksRes] = await Promise.all([
        Artists.get(artistId),
        Tracks.byArtist(artistId, 20),
      ]);
      const artist = artistRes.data ?? artistRes;
      const tracks = tracksRes.data ?? tracksRes;

      window.__artistTracks = tracks;
      window.__setQueue     = setQueue;

      const ci = _colorIdx(artistId);
      const c1 = genreColor(ci);
      const c2 = genreColor((ci + 3) % 10);

      el.innerHTML = `
        <div class="detail-hero" style="background:linear-gradient(135deg,${c1},${c2})">
          ${coverArt(ci, 'xl', GLYPH.mic)}
          <div class="detail-hero-meta">
            <div class="detail-hero-type">Artista</div>
            <div class="detail-hero-name">${artist.name}</div>
            <div class="detail-hero-sub">${artist.track_count ?? tracks.length} canciones${artist.country ? ' · ' + artist.country : ''}</div>
            <div class="detail-hero-actions">
              <button class="btn btn-primary"
                onclick="window.__setQueue(window.__artistTracks, 0)">▶ Reproducir todo</button>
            </div>
          </div>
        </div>

        <div class="attr-grid mb-4">
          <div class="attr-card">
            <div class="attr-label">País</div>
            <div class="attr-value" style="font-size:.95rem">${artist.country || '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Sello</div>
            <div class="attr-value" style="font-size:.85rem">${artist.record_label || '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Canciones</div>
            <div class="attr-value">${artist.track_count ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Popularidad</div>
            <div class="attr-value">${artist.avg_popularity ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Energía</div>
            <div class="attr-value">${artist.avg_energy ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Baile</div>
            <div class="attr-value">${artist.avg_danceability ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Valencia</div>
            <div class="attr-value">${artist.avg_valence ?? '—'}</div>
          </div>
        </div>

        <h2 class="section-title">Canciones populares</h2>
        <div class="track-list">${tracks.map((t, i) => trackRow(t, i)).join('')}</div>`;
    } catch (err) {
      el.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  await initFavorites();
  load();
</script>
</body>
</html>
