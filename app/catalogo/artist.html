<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artista — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="page-content"><div class="loading-center"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth } from '/js/auth.js';
  import { renderSidebar, renderPlayer, trackRow } from '/js/components.js';
  import { Artists, Tracks } from '/js/api.js';

  if (!requireAuth()) throw new Error('not auth');
  renderSidebar('');
  renderPlayer();

  const artistId = new URLSearchParams(location.search).get('id');
  if (!artistId) { location.href = '/catalogo/catalog.html'; }

  async function load() {
    const el = document.getElementById('page-content');
    try {
      const [artistRes, tracksRes] = await Promise.all([
        Artists.get(artistId),
        Tracks.byArtist(artistId, 20),
      ]);
      const artist = artistRes.data ?? artistRes;
      const tracks = tracksRes.data ?? tracksRes;

      el.innerHTML = `
        <div class="page-header">
          <div class="page-thumb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></div>
          <div class="page-meta">
            <div class="page-type">Artista</div>
            <div class="page-name">${artist.name}</div>
            <div class="page-sub">${artist.track_count ?? tracks.length} canciones</div>
          </div>
        </div>

        <div class="attr-grid mb-4">
          <div class="attr-card">
            <div class="attr-label">País</div>
            <div class="attr-value" style="font-size:.95rem">${artist.country || '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Sello</div>
            <div class="attr-value" style="font-size:.85rem">${artist.record_label || '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Canciones</div>
            <div class="attr-value">${artist.track_count ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Popularidad</div>
            <div class="attr-value">${artist.avg_popularity ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Energía</div>
            <div class="attr-value">${artist.avg_energy ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Baile</div>
            <div class="attr-value">${artist.avg_danceability ?? '—'}</div>
          </div>
          <div class="attr-card">
            <div class="attr-label">Valencia</div>
            <div class="attr-value">${artist.avg_valence ?? '—'}</div>
          </div>
        </div>

        <h2 class="section-title">Canciones populares</h2>
        <div class="track-list">${tracks.map((t, i) => trackRow(t, i)).join('')}</div>`;
    } catch (err) {
      el.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
