<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analítica — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <div id="access-denied" style="display:none;text-align:center;padding:4rem 2rem">
      <div style="margin-bottom:1rem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h2 style="margin-bottom:.75rem">Acceso restringido</h2>
      <p class="text-muted">No tienes permisos para acceder a esta sección.</p>
    </div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth, hasAnalyticsAccess } from '/js/auth.js';
  import { renderSidebar, renderPlayer } from '/js/components.js';

  if (!requireAuth()) throw new Error('not auth');

  if (hasAnalyticsAccess()) {
    window.location.href = '/analytics/dashboard.html';
  } else {
    renderSidebar('analytics');
    renderPlayer();
    document.getElementById('access-denied').style.display = 'block';
  }
</script>
</body>
</html>
