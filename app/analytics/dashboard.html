<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/analytics.css"/>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <h1 class="page-title">Dashboard Ejecutivo</h1>

    <div id="error-banner"></div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Total Tracks</div><div class="kpi-value" id="kpi-tracks">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Total Géneros</div><div class="kpi-value" id="kpi-genres">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Total Artistas</div><div class="kpi-value" id="kpi-artists">—</div></div>
      <div class="kpi-card" style="border-left-color:#68d391">
        <div class="kpi-label">Último ETL</div>
        <div class="kpi-value" id="kpi-etl-status" style="font-size:1.1rem">—</div>
        <div class="kpi-sub" id="kpi-etl-sub"></div>
      </div>
      <div class="kpi-card" style="border-left-color:#f6ad55">
        <div class="kpi-label">Popularidad Promedio</div>
        <div class="kpi-value" id="kpi-popularity">—</div>
      </div>
      <div class="kpi-card" style="border-left-color:#90cdf4">
        <div class="kpi-label">Energía Promedio</div>
        <div class="kpi-value" id="kpi-energy">—</div>
      </div>
    </div>

    <!-- Charts Row 1 -->
    <div class="grid-2 mb-3">
      <div class="card">
        <div class="card-header">Géneros: Popularidad vs Energía (tamaño = tracks)</div>
        <div class="card-body" style="padding:.5rem">
          <div id="bubble-chart" class="chart-container"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Perfil de Audio — Top Género: <span id="top-genre-name">—</span></div>
        <div class="card-body" style="padding:.5rem">
          <div id="radar-chart" class="chart-container"></div>
        </div>
      </div>
    </div>

    <!-- Charts Row 2 -->
    <div class="grid-2">
      <div class="card">
        <div class="card-header">Top 10 Géneros por Tracks</div>
        <div class="card-body" style="padding:.5rem">
          <div id="genres-bar-chart" class="chart-container" style="min-height:280px"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Top 10 Artistas por Tracks</div>
        <div class="card-body" style="padding:.5rem">
          <div id="artists-bar-chart" class="chart-container" style="min-height:280px"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth, hasAnalyticsAccess } from '/js/auth.js';
  import { renderSidebar, renderPlayer } from '/js/components.js';
  if (!requireAuth() || !hasAnalyticsAccess()) {
    window.location.href = '/catalogo/home.html';
    throw new Error('unauthorized');
  }
  renderSidebar('analytics');
  renderPlayer();

  const API = '/api';

  const plotLayout = (extra = {}) => ({
    paper_bgcolor: 'transparent',
    plot_bgcolor:  'transparent',
    font: { family: "'Plus Jakarta Sans', system-ui", color: '#ffffff', size: 12 },
    margin: { t: 20, r: 20, b: 50, l: 50 },
    ...extra
  });

  const plotConfig = { responsive: true, displayModeBar: false };

  function showError(msg) {
    document.getElementById('error-banner').innerHTML =
      `<div class="alert alert-error">${msg}</div>`;
  }

  async function fetchJSON(path) {
    const res = await fetch(API + path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function loadDashboard() {
    try {
      const data = await fetchJSON('/dashboard/executive');

      document.getElementById('kpi-tracks').textContent  = (data.totals.tracks  ?? 0).toLocaleString();
      document.getElementById('kpi-genres').textContent  = (data.totals.genres  ?? 0).toLocaleString();
      document.getElementById('kpi-artists').textContent = (data.totals.artists ?? 0).toLocaleString();

      const etl = data.last_etl;
      if (etl) {
        const statusEl = document.getElementById('kpi-etl-status');
        statusEl.textContent = etl.status ?? '—';
        const colors = { success: '#68d391', failed: '#fc8181', running: '#90cdf4' };
        statusEl.style.color = colors[etl.status] ?? 'inherit';
        document.getElementById('kpi-etl-sub').textContent =
          etl.run_timestamp ? (() => { const s = String(etl.run_timestamp); return new Date(s.endsWith('Z') ? s : s + 'Z').toLocaleString('es-EC', { timeZone: 'America/Guayaquil' }); })() : '';
      }

      const avg = data.audio_averages;
      if (avg) {
        document.getElementById('kpi-popularity').textContent = avg.avg_popularity ?? '—';
        document.getElementById('kpi-energy').textContent     = avg.avg_energy ?? '—';
      }

      const tg = data.top_genres ?? [];
      Plotly.newPlot('genres-bar-chart', [{
        x: tg.map(g => g.track_count),
        y: tg.map(g => g.name),
        type: 'bar', orientation: 'h',
        marker: { color: '#8B5CF6' }
      }], plotLayout({ margin: { t: 10, r: 20, b: 30, l: 130 }, xaxis: { title: 'Tracks', gridcolor: 'rgba(255,255,255,0.08)' } }), plotConfig);

      const ta = data.top_artists ?? [];
      Plotly.newPlot('artists-bar-chart', [{
        x: ta.map(a => a.track_count),
        y: ta.map(a => a.name),
        type: 'bar', orientation: 'h',
        marker: { color: '#8B5CF6' }
      }], plotLayout({ margin: { t: 10, r: 20, b: 30, l: 130 }, xaxis: { title: 'Tracks', gridcolor: 'rgba(255,255,255,0.08)' } }), plotConfig);

    } catch (e) {
      showError(`Error cargando el dashboard: ${e.message}`);
    }
  }

  async function loadGenreCharts() {
    try {
      const res = await fetchJSON('/genres/trends?limit=100');
      const genres = res.data ?? [];
      if (!genres.length) return;

      Plotly.newPlot('bubble-chart', [{
        x: genres.map(g => g.avg_popularity),
        y: genres.map(g => g.avg_energy),
        text: genres.map(g => g.name),
        mode: 'markers',
        type: 'scatter',
        marker: {
          size: genres.map(g => Math.max(8, Math.sqrt(g.track_count) * 2.5)),
          color: genres.map(g => g.avg_danceability),
          colorscale: 'Viridis',
          showscale: true,
          colorbar: { title: 'Danceability', thickness: 14 },
          opacity: 0.8,
          line: { color: 'rgba(139,92,246,.3)', width: 1 }
        },
        hovertemplate: '<b>%{text}</b><br>Popularidad: %{x}<br>Energía: %{y}<extra></extra>'
      }], plotLayout({
        xaxis: { title: 'Popularidad Promedio', gridcolor: 'rgba(255,255,255,0.08)' },
        yaxis: { title: 'Energía Promedio',     gridcolor: 'rgba(255,255,255,0.08)' }
      }), plotConfig);

      const top = genres[0];
      document.getElementById('top-genre-name').textContent = top.name ?? '';
      const profile = await fetchJSON(`/genres/${top.genre_id}/audio-profile`);
      renderRadar('radar-chart', profile);

    } catch (e) {
      console.error('Error en gráficos de géneros:', e);
    }
  }

  function renderRadar(elementId, profile) {
    const features = ['danceability','energy','speechiness','acousticness','instrumentalness','liveness','valence'];
    const labels   = ['Dance','Energy','Speech','Acoustic','Instrumental','Liveness','Valence'];
    const values   = features.map(f => profile[f] ?? 0);

    Plotly.newPlot(elementId, [{
      type: 'scatterpolar',
      r: [...values, values[0]],
      theta: [...labels, labels[0]],
      fill: 'toself',
      fillcolor: 'rgba(139,92,246,.25)',
      line: { color: '#8B5CF6', width: 2 },
      name: profile.name ?? ''
    }], {
      polar: {
        radialaxis: { visible: true, range: [0, 1], gridcolor: 'rgba(255,255,255,0.1)' },
        bgcolor: 'transparent'
      },
      paper_bgcolor: 'transparent',
      font: { family: "'Plus Jakarta Sans', system-ui", color: '#ffffff', size: 11 },
      margin: { t: 30, r: 50, b: 30, l: 50 },
      showlegend: false
    }, plotConfig);
  }

  loadDashboard();
  loadGenreCharts();
</script>
</body>
</html>
