<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benchmark de Género — Tracklytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/analytics.css"/>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
<div id="sidebar-root"></div>
<div class="app-layout">
  <main class="main-content">
    <h1 class="page-title">Artista vs. Benchmark de Género</h1>

    <div id="error-banner"></div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="search-row">
          <div class="form-group" style="flex:1;margin:0">
            <input type="text" id="search-input" class="form-control"
                   placeholder="Buscar artista por nombre..." autocomplete="off"/>
          </div>
          <button class="btn btn-primary" onclick="doSearch()">Buscar</button>
        </div>
        <div id="search-results" style="display:none;margin-top:.5rem">
          <div class="table-wrapper">
            <table><tbody id="results-tbody"></tbody></table>
          </div>
        </div>
      </div>
    </div>

    <div id="benchmark-results" style="display:none">
      <div class="card mb-3">
        <div class="card-header">
          <span id="artist-name-header">—</span>
          <span class="text-muted" style="font-size:.8rem">vs. promedio de <span id="genre-name-header">—</span> (sin excluir outliers)</span>
        </div>
        <div class="card-body" style="padding:.5rem">
          <div id="radar-chart" class="chart-container" style="min-height:340px"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Tabla Comparativa</div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>Atributo</th><th>Artista</th><th>Promedio del Género</th><th>Diferencia</th></tr>
            </thead>
            <tbody id="compare-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="empty-state">
      <div class="empty-state">
        <p>Busca un artista para ver su benchmark contra el promedio de su género predominante</p>
      </div>
    </div>
  </main>
</div>
<div id="player-root"></div>

<script type="module">
  import { requireAuth, hasAnalyticsAccess, getToken } from '/js/auth.js';
  import { renderSidebar, renderPlayer } from '/js/components.js';
  import { showToast } from '/js/toast.js';
  if (!requireAuth() || !hasAnalyticsAccess()) {
    window.location.href = '/catalogo/home.html';
    throw new Error('unauthorized');
  }
  renderSidebar('analytics');
  renderPlayer();

  const API = '/api';
  const plotConfig = { responsive: true, displayModeBar: false };

  function showError(msg) {
    document.getElementById('error-banner').innerHTML = `<div class="alert alert-error">${msg}</div>`;
  }

  let _accessDenied = false;

  async function fetchJSON(path) {
    const res = await fetch(API + path, { headers: { Authorization: `Bearer ${getToken()}` } });
    if (res.status === 403) {
      if (!_accessDenied) {
        _accessDenied = true;
        showToast('Se requiere una suscripción activa para acceder a este panel. Redirigiendo a Planes…', 'warning');
        setTimeout(() => { window.location.href = '/autenticacion/planes.html'; }, 2200);
      }
      const err = new Error('access_denied');
      err.accessDenied = true;
      throw err;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function doSearch() {
    const name = document.getElementById('search-input').value.trim();
    if (!name) return;
    try {
      const data = await fetchJSON(`/artists/search?name=${encodeURIComponent(name)}&limit=8`);
      const rows = data.data ?? [];
      const tbody = document.getElementById('results-tbody');
      document.getElementById('search-results').style.display = 'block';
      tbody.innerHTML = rows.length
        ? rows.map(a => `
            <tr>
              <td>${a.name ?? '—'}</td>
              <td><button class="btn btn-primary btn-sm" onclick="loadBenchmark(${a.artist_id})">Ver benchmark</button></td>
            </tr>`).join('')
        : `<tr><td class="text-muted" style="padding:.75rem 1rem">Sin resultados</td></tr>`;
    } catch (e) {
      if (!e.accessDenied) showError(`Error buscando artista: ${e.message}`);
    }
  }

  async function loadBenchmark(artistId) {
    document.getElementById('error-banner').innerHTML = '';
    try {
      const data = await fetchJSON(`/app/v1/analitica/artistas/${artistId}/benchmark`);
      const { artista, genero_benchmark } = data;

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('benchmark-results').style.display = 'block';
      document.getElementById('artist-name-header').textContent = artista.name;
      document.getElementById('genre-name-header').textContent  = genero_benchmark.name;

      const FEATURES = [
        { artistKey: 'avg_danceability',     genreKey: 'danceability',     label: 'Danceability' },
        { artistKey: 'avg_energy',           genreKey: 'energy',           label: 'Energy' },
        { artistKey: 'avg_speechiness',      genreKey: 'speechiness',      label: 'Speechiness' },
        { artistKey: 'avg_acousticness',     genreKey: 'acousticness',     label: 'Acousticness' },
        { artistKey: 'avg_instrumentalness', genreKey: 'instrumentalness', label: 'Instrumentalness' },
        { artistKey: 'avg_liveness',         genreKey: 'liveness',         label: 'Liveness' },
        { artistKey: 'avg_valence',          genreKey: 'valence',          label: 'Valence' },
      ];
      const labels    = FEATURES.map(f => f.label);
      const artistVal = FEATURES.map(f => artista[f.artistKey] ?? 0);
      const genreVal  = FEATURES.map(f => genero_benchmark[f.genreKey] ?? 0);

      Plotly.newPlot('radar-chart', [
        { type: 'scatterpolar', r: [...artistVal, artistVal[0]], theta: [...labels, labels[0]],
          fill: 'toself', fillcolor: 'rgba(139,92,246,.2)', line: { color: '#8B5CF6', width: 2.5 }, name: artista.name },
        { type: 'scatterpolar', r: [...genreVal, genreVal[0]], theta: [...labels, labels[0]],
          fill: 'toself', fillcolor: 'rgba(246,173,85,.15)', line: { color: '#f6ad55', width: 2.5 }, name: `Promedio ${genero_benchmark.name}` },
      ], {
        polar: { radialaxis: { visible: true, range: [0, 1], gridcolor: 'rgba(255,255,255,0.1)' }, bgcolor: 'transparent' },
        paper_bgcolor: 'transparent',
        font: { family: "'Plus Jakarta Sans', system-ui", color: '#ffffff', size: 12 },
        margin: { t: 30, r: 100, b: 30, l: 100 },
        showlegend: true,
        legend: { orientation: 'h', y: -0.1 },
      }, plotConfig);

      document.getElementById('compare-tbody').innerHTML = FEATURES.map(f => {
        const a = artista[f.artistKey] ?? 0;
        const g = genero_benchmark[f.genreKey] ?? 0;
        const diff = a - g;
        const diffStyle = diff === 0 ? 'color:var(--text-muted)' : diff > 0 ? 'color:#68d391' : 'color:#fc8181';
        return `<tr>
          <td class="text-muted">${f.label}</td>
          <td>${a}</td>
          <td>${g}</td>
          <td style="${diffStyle}">${diff > 0 ? '+' : ''}${diff.toFixed(4)}</td>
        </tr>`;
      }).join('');

    } catch (e) {
      if (!e.accessDenied) showError(`Error cargando benchmark: ${e.message}`);
    }
  }

  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  window.doSearch      = doSearch;
  window.loadBenchmark = loadBenchmark;
</script>
</body>
</html>
