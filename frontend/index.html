<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Fingerprint de build (ver frontend/Dockerfile) — confirma con
         `curl -s http://localhost:8082/ | grep build-commit` qué commit
         está sirviendo realmente el container, sin depender de que alguien
         reconozca visualmente si una página cambió. -->
    <meta name="build-commit" content="%VITE_GIT_COMMIT%" />
    <title>Tracklytics</title>
    <script>
      // Aplica el tema guardado antes del primer paint — sin esto, una
      // preferencia dark persistida mostraría un flash de light (default)
      // hasta que React monte ThemeProvider.
      (function () {
        try {
          if (localStorage.getItem('tracklytics-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
