server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed build assets aggressively — Vite content-hashes everything
  # under dist/assets/ (filename changes on every change, so "immutable" is
  # actually true here).
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Assets served from frontend/public/ (logo.png, favicon, etc.) keep a
  # STABLE filename across deploys — Vite copies them through unchanged, no
  # hash. Bug found in prod: the old blanket rule below matched these by
  # extension and slapped the same 1-year "immutable" header on them, so a
  # logo swap under the same filename never reached returning browsers no
  # matter how many times the image itself was rebuilt/redeployed. `no-cache`
  # (not "no-store") still lets the browser cache the file — it just
  # revalidates via ETag/Last-Modified on every request, so nginx 304s back
  # to a browser that already has the current bytes instead of re-downloading.
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "no-cache";
  }

  # JS/CSS at the dist root (there are none today — everything hashed lands
  # under /assets/ — but keep this so a future root-level script/style isn't
  # silently pinned to a stale copy for a year either).
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — all unmatched routes serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to FastAPI (in Docker Compose, service name is "api")
  location /app/v1/ {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Rutas montadas en la raíz del backend (sin prefijo /app/v1): router legacy
  # de analitica (/dashboard/executive), base de gestion_datos (/health,
  # /etl/*, /data-quality, /facts, /dim/*) y partners (/partners/v1/*). Sin
  # esto caen en el fallback SPA de abajo (index.html en vez de JSON real) —
  # mismo gap real corregido en vite.config.ts para dev.
  location ~ ^/(dashboard|health|etl|data-quality|facts|dim|partners/v1)(/|$) {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;
}
