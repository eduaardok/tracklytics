server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets aggressively (Vite adds content hashes to filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — all unmatched routes serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to FastAPI (in Docker Compose, service name is "api")
  location /app/v1/ {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Rutas montadas en la raíz del backend (sin prefijo /app/v1): router legacy
  # de analitica (/dashboard/executive), base de gestion_datos (/health,
  # /etl/*, /data-quality, /facts, /dim/*) y partners (/partners/v1/*). Sin
  # esto caen en el fallback SPA de abajo (index.html en vez de JSON real) —
  # mismo gap real corregido en vite.config.ts para dev.
  location ~ ^/(dashboard|health|etl|data-quality|facts|dim|partners/v1)(/|$) {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;
}
