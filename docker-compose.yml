services:
  db:
    image: postgres:18
    container_name: tracklytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresqlAdmin19
      POSTGRES_DB: tracklytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: