services:

  # ─────────────────────────────────────────
  # 0. Mailpit — SMTP real para verificación de email (P2, S16). Sin auth,
  #    captura cualquier correo que el API envíe; bandeja web en :8025 para
  #    inspeccionar el envío real sin depender de un proveedor externo.
  # ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: tracklytics_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 1. PocketBase  — fuente de datos (inmutable)
  # ─────────────────────────────────────────
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: tracklytics_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    environment:
      # Bug real encontrado en la prueba de arranque limpio (S14-P4, Fase 6.1):
      # en un volumen `pb_data` genuinamente vacío, PocketBase no crea ningún
      # superusuario solo — exige visitar el wizard de instalación o correr
      # `pocketbase superuser upsert` a mano (nunca automatizado en este repo).
      # `pb-init` fallaba con 400 al autenticarse contra `_superusers/auth-
      # with-password` porque ese superusuario simplemente no existía todavía.
      # Nunca se había visto: el volumen del stack principal lleva semanas
      # vivo, con un superusuario creado a mano en algún momento pasado. La
      # propia imagen (`entrypoint.sh`) ya soporta crearlo sola vía estas dos
      # variables — mismas credenciales que `pb-init` ya usa para autenticarse.
      PB_ADMIN_EMAIL:    ${POCKETBASE_EMAIL}
      PB_ADMIN_PASSWORD: ${POCKETBASE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 2. PocketBase Init  — crea colección y carga CSV (una sola vez, idempotente)
  # ─────────────────────────────────────────
  pb-init:
    build:
      context: .
      dockerfile: pb_init_Dockerfile
    container_name: tracklytics_pb_init
    restart: no
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      POCKETBASE_URL:        ${POCKETBASE_URL}
      POCKETBASE_EMAIL:      ${POCKETBASE_EMAIL}
      POCKETBASE_PASSWORD:   ${POCKETBASE_PASSWORD}
      POCKETBASE_COLLECTION: ${POCKETBASE_COLLECTION:-spotify_tracks}
      CSV_PATH:              /app/dataset/spotify.csv
    volumes:
      - ./dataset:/app/dataset:ro
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 3. ClickHouse  — base de datos columnar
  # ─────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: tracklytics_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    environment:
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 4. Init DB  — crea schema ClickHouse (una sola vez, idempotente)
  # ─────────────────────────────────────────
  init-db:
    build:
      context: .
      dockerfile: init_Dockerfile
    container_name: tracklytics_init
    restart: no
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST:     clickhouse
      CLICKHOUSE_PORT:     8123
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 3b. ClickHouse Gold  — segunda instancia, capa de agregaciones (S13-P2).
  # Separada a propósito del ClickHouse de catálogo (arriba): el docente pide
  # que Gold viva en su propia instancia, no en una base de datos adicional
  # dentro de la misma. Puerto 8124 (HTTP) / 9001 (nativo) para no colisionar
  # con 8123/9000 del ClickHouse de catálogo. Sin tablas todavía — solo la
  # base de datos vacía (`init-db-gold`); P3 crea las tablas y los DAGs.
  # ─────────────────────────────────────────
  clickhouse-gold:
    image: clickhouse/clickhouse-server:24.3
    container_name: tracklytics_clickhouse_gold
    restart: unless-stopped
    ports:
      - "8124:8123"   # HTTP interface
      - "9001:9000"   # Native TCP interface
    environment:
      CLICKHOUSE_DB:       ${CLICKHOUSE_GOLD_DB:-tracklytics_gold}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ch_gold_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 3c. Init DB Gold  — crea la base de datos vacía en ClickHouse Gold
  # ─────────────────────────────────────────
  init-db-gold:
    build:
      context: .
      dockerfile: init_gold_Dockerfile
    container_name: tracklytics_init_gold
    restart: no
    depends_on:
      clickhouse-gold:
        condition: service_healthy
    environment:
      CLICKHOUSE_GOLD_HOST: clickhouse-gold
      CLICKHOUSE_GOLD_PORT: 8123   # puerto INTERNO del contenedor, no el 8124 publicado al host
      CLICKHOUSE_GOLD_DB:   ${CLICKHOUSE_GOLD_DB:-tracklytics_gold}
      CLICKHOUSE_USER:      ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD:  ${CLICKHOUSE_PASSWORD}
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 4. Init Permissions  — ajusta permisos del volumen parquet_stage
  # ─────────────────────────────────────────
  init-permissions:
    image: busybox
    container_name: tracklytics_init_permissions
    restart: no
    command: ["chmod", "777", "/app/parquet_stage"]
    volumes:
      - parquet_stage:/app/parquet_stage
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 4. ETL Python  — ejecución directa (legacy; Airflow es el orquestador)
  # ─────────────────────────────────────────
  etl:
    build:
      context: .
      dockerfile: etl/etl_Dockerfile
    container_name: tracklytics_etl
    restart: no
    depends_on:
      pocketbase:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      POCKETBASE_URL:      ${POCKETBASE_URL}
      POCKETBASE_EMAIL:    ${POCKETBASE_EMAIL}
      POCKETBASE_PASSWORD: ${POCKETBASE_PASSWORD}
      POCKETBASE_COLLECTION: ${POCKETBASE_COLLECTION}
      CLICKHOUSE_HOST:     clickhouse
      # 8123 (HTTP), no 9000 (protocolo nativo) — bug preexistente encontrado
      # al lanzar `gold/reload_portadas_5h.py` standalone: `utils.clickhouse_client`
      # usa `clickhouse_connect.get_client` (cliente HTTP), que devuelve
      # "Port 9000 is for clickhouse-client program" contra el puerto nativo.
      # El servicio `api` ya usaba 8123 correctamente; `etl` nunca lo necesitó
      # hasta ahora porque el DAG real corre dentro de `airflow`, no de este
      # contenedor standalone.
      CLICKHOUSE_PORT:     8123
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      PARQUET_DIR:         /app/parquet_stage
      WEEK_NUMBER:         ${WEEK_NUMBER:-1}
    volumes:
      - parquet_stage:/app/parquet_stage
      # Bind mount del código fuente — la imagen hornea `COPY etl/ . → /app`
      # (etl_Dockerfile), así que este overlay hace que /app SEA ./etl del host:
      # las corridas standalone (ej. `python -u -m gold.reload_portadas_9h`)
      # importan código vivo y, sobre todo, `portadas_cache.json` se escribe
      # en el host (`./etl/gold/portadas_cache.json`) y no en la capa efímera
      # del contenedor (bug real: la corrida de 9h de S14-P1 resolvió miles de
      # portadas y el cache del host quedó congelado en jul-2026; se recuperó
      # con `docker cp` desde el contenedor detenido).
      - ./etl:/app
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 4. API  — FastAPI + Uvicorn
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/api_Dockerfile
    container_name: tracklytics_api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-gold:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST:     clickhouse
      CLICKHOUSE_PORT:     8123
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Capa Gold (S13-P2, infraestructura sin tablas todavía — ver P3) —
      # puerto INTERNO 8123 del contenedor `clickhouse-gold`, no el 8124
      # publicado al host.
      CLICKHOUSE_GOLD_HOST: clickhouse-gold
      CLICKHOUSE_GOLD_PORT: 8123
      CLICKHOUSE_GOLD_DB:   ${CLICKHOUSE_GOLD_DB:-tracklytics_gold}
      AIRFLOW_URL:         http://airflow:8080
      AIRFLOW_USER:        ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD:    ${AIRFLOW_PASSWORD:-tracklytics2026}
      AIRFLOW_DAG_ID:      ${AIRFLOW_DAG_ID:-tracklytics_etl}
      POCKETBASE_URL:      ${POCKETBASE_URL}
      POCKETBASE_EMAIL:    ${POCKETBASE_EMAIL}
      POCKETBASE_PASSWORD: ${POCKETBASE_PASSWORD}
      YOUTUBE_API_KEY:     ${YOUTUBE_API_KEY:-}
      SMTP_HOST:           mailpit
      SMTP_PORT:           1025
      SMTP_FROM:           ${SMTP_FROM:-no-reply@tracklytics.local}
    volumes:
      - ./api:/app
    networks:
      - tracklytics-net
    healthcheck:
      # Sin curl/wget en python:3.11-slim (api_Dockerfile) — Python ya está,
      # se reusa en vez de agregar un paquete al sistema solo para esto.
      # `/docs` (Swagger UI de FastAPI) no requiere auth y siempre está
      # disponible si el proceso levantó — S14-P4, necesario para que
      # `seed-cuentas-demo` pueda depender de `service_healthy` en vez de un
      # `sleep`.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ─────────────────────────────────────────
  # 4b. Siembra de cuentas demo — S14-P4, ver seed_cuentas_demo.py
  # ─────────────────────────────────────────
  seed-cuentas-demo:
    build:
      context: .
      dockerfile: seed_cuentas_demo_Dockerfile
    container_name: tracklytics_seed_cuentas_demo
    restart: no
    depends_on:
      api:
        condition: service_healthy
      # Bug real encontrado en la prueba de arranque limpio (S14-P4, Fase 6.1):
      # `pb-init` es quien agrega los campos custom `role`/`pais` a la colección
      # `users` de PocketBase (`ensure_users_text_field`). Sin esta dependencia,
      # `pb-init` y `api` arrancan en paralelo (ninguno depende del otro) y en un
      # entorno recién levantado `seed-cuentas-demo` podía crear la cuenta
      # superadmin ANTES de que esos campos existieran en el esquema —
      # PocketBase descarta en silencio los campos desconocidos al insertar, así
      # que la cuenta quedaba sin `role` en absoluto (ni "admin" ni ningún otro
      # valor), y el auto-backfill a superadmin (`deps.py::_asegurar_superadmin`)
      # nunca se disparaba: las 6 asignaciones de rol siguientes fallaban con
      # 403 "Esta operación requiere un rol administrativo distinto". Nunca se
      # había visto porque el stack principal reutilizaba una cuenta superadmin
      # ya vieja (con el esquema ya migrado) en vez de una recién creada.
      pb-init:
        condition: service_completed_successfully
    environment:
      REPORTES_API_ROOT:        http://api:8000
      POCKETBASE_URL:           http://pocketbase:8090
      SUPERADMIN_DEMO_PASSWORD: ${SUPERADMIN_DEMO_PASSWORD:-Demo12345!}
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 5. Airflow  — orquestador del pipeline ETL
  #    UI: http://localhost:8080  (user: admin / ver logs del contenedor para la contraseña)
  # ─────────────────────────────────────────
  airflow:
    build:
      context: .
      dockerfile: airflow_Dockerfile
    container_name: tracklytics_airflow
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid &&
      airflow db migrate &&
      airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME} --password $${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@tracklytics.com 2>/dev/null || true &&
      airflow standalone"
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-gold:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__API__ENABLE_EXPERIMENTAL_API: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-tracklytics2026}
      AIRFLOW__WEBSERVER__WORKERS: 1
      # Defaults (120s/120s) son insuficientes en este entorno de desarrollo:
      # el gunicorn master del webserver compite por CPU con el scheduler y
      # las corridas del DAG (SequentialExecutor, mismo contenedor) y se
      # marcaba a sí mismo como no-responsivo, forzando un auto-shutdown que
      # NUNCA se recuperaba solo (root cause real del "unhealthy" en S13-P4,
      # no un problema cosmético del healthcheck — ver docs/BITACORA_S13.md).
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 60
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 60
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-tracklytics2026}
      POCKETBASE_URL:        ${POCKETBASE_URL}
      POCKETBASE_EMAIL:      ${POCKETBASE_EMAIL}
      POCKETBASE_PASSWORD:   ${POCKETBASE_PASSWORD}
      POCKETBASE_COLLECTION: ${POCKETBASE_COLLECTION:-spotify_tracks}
      CLICKHOUSE_HOST:       clickhouse
      CLICKHOUSE_PORT:       8123
      CLICKHOUSE_DB:         ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:       ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD:   ${CLICKHOUSE_PASSWORD}
      # Capa Gold (S13-P3a) — puerto INTERNO 8123 del contenedor
      # `clickhouse-gold`, no el 8124 publicado al host.
      CLICKHOUSE_GOLD_HOST:  clickhouse-gold
      CLICKHOUSE_GOLD_PORT:  8123
      CLICKHOUSE_GOLD_DB:    ${CLICKHOUSE_GOLD_DB:-tracklytics_gold}
      PARQUET_DIR:           /app/parquet_stage
      WEEK_NUMBER:           ${WEEK_NUMBER:-1}
      PYTHONPATH:            /opt/airflow/etl_src
      # Cuenta demo `superadmin` (S14-P3/P4) — usada por
      # `gold/backfill_negocio.py` para liquidar regalías vía HTTP real.
      # Mismo default que `seed-cuentas-demo` (docker-compose.yml) y
      # `docs/CUENTAS_DEMO.md` — sin configuración manual, `docker compose
      # up` sigue funcionando; se puede sobreescribir por variable de
      # entorno sin tocar código (hallazgo S14-P4, Fase 1: antes hardcodeado
      # en texto plano en el módulo).
      SUPERADMIN_DEMO_EMAIL:    ${SUPERADMIN_DEMO_EMAIL:-superadmin@demo.tracklytics.com}
      SUPERADMIN_DEMO_PASSWORD: ${SUPERADMIN_DEMO_PASSWORD:-Demo12345!}
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl_src
      - airflow_home:/opt/airflow
      - parquet_stage:/app/parquet_stage
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - tracklytics-net

  # ─────────────────────────────────────────
  # 6. Frontend React — el vigente (RT-03: todo corre en Docker). Build
  #    multi-stage (Vite compila, Nginx sirve estático + proxea al backend)
  #    en `frontend/Dockerfile`; reglas de proxy en `frontend/nginx.conf`
  #    replican exactamente las de `frontend/vite.config.ts` (dev server).
  # ─────────────────────────────────────────
  frontend-react:
    build:
      context: ./frontend
      args:
        # URL pública de Airflow (la que abre el navegador del usuario), no
        # la interna `AIRFLOW_URL` de red Docker que usa el backend arriba —
        # override si se accede desde otra IP/host que no sea localhost.
        VITE_AIRFLOW_PUBLIC_URL: ${AIRFLOW_PUBLIC_URL:-http://localhost:8080}
        # Fingerprint de commit horneado en el HTML servido (ver
        # frontend/Dockerfile e index.html) — `scripts/rebuild-frontend.sh`
        # lo pasa automáticamente; si se corre `docker compose build` a
        # mano sin exportar la variable, queda "sin-commit" (rastro visible
        # de que no se usó el script).
        VITE_GIT_COMMIT: ${VITE_GIT_COMMIT:-sin-commit}
    container_name: tracklytics_frontend_react
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"
    networks:
      - tracklytics-net

# ─────────────────────────────────────────
# Volúmenes persistentes
# ─────────────────────────────────────────
volumes:
  pb_data:
  ch_data:
  ch_gold_data:
  parquet_stage:
  airflow_home:

# ─────────────────────────────────────────
# Red interna
# ─────────────────────────────────────────
networks:
  tracklytics-net:
    driver: bridge